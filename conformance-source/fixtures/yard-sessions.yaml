    conformanceOwner: server
    conformanceSuite: session-contracts
    input:
      surface: continuation
  - expected:
      lifetimeMilliseconds: 60000
    id: exchange-code-lifetime-is-sixty-seconds
    conformanceOwner: testkit
    conformanceSuite: yard-sessions
    input:
      surface: exchange-code
  - expected:
      lifetimeMilliseconds: 43200000
    id: session-lifetime-is-twelve-hours
    conformanceOwner: testkit
    conformanceSuite: yard-sessions
    input:
      surface: session
  - expected:
      propagationMilliseconds: 0
    id: revocation-bound-is-zero-ms
    conformanceOwner: testkit
    conformanceSuite: yard-sessions
    input:
      surface: session-revocation
  - expected:
      attributes:
        - Secure
        - HttpOnly
        - SameSite=Lax
        - Path=/
        - Max-Age=43200
      name: __Host-blobyard-yard-session
